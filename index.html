<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Firm Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky header with search, hero strip, filter bar, product grid, detail modal, cart drawer */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#161a2e; --muted:#5d6479; --line:#e2e5ec;
  --accent:#e4572e; --accent-ink:#ffffff; --good:#1c8a5a; --chip:#eceef4;
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#181c30; --ink:#eef0f8; --muted:#9aa1b8; --line:#2a3050;
  --accent:#ff6a3d; --accent-ink:#1a0d08; --good:#44c58b; --chip:#232845; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#181c30; --ink:#eef0f8; --muted:#9aa1b8; --line:#2a3050;
  --accent:#ff6a3d; --accent-ink:#1a0d08; --good:#44c58b; --chip:#232845; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}

.topbar{background:var(--ink);color:var(--bg);font-size:13px;text-align:center;padding:7px 12px}
header.site{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.brand b{color:var(--accent)}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:0 14px;font:inherit}
.icon-btn{height:42px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:flex;align-items:center;gap:8px;font-weight:500}
.icon-btn .count{background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
nav.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
nav.cats button{border:0;background:transparent;padding:6px 12px;border-radius:99px;white-space:nowrap;color:var(--muted);font-weight:500}
nav.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;padding-block:24px}
.hero-main{background:var(--ink);color:var(--bg);border-radius:14px;padding:36px;display:flex;flex-direction:column;gap:14px;justify-content:center;min-height:240px}
.hero-main h1{font-size:clamp(28px,4vw,44px);line-height:1.05;letter-spacing:-.02em}
.hero-main p{margin:0;max-width:46ch;opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 20px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;width:max-content}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.trust{display:grid;gap:12px;align-content:center}
.trust div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.trust strong{display:block;font-family:var(--font-display)}
.trust span{color:var(--muted);font-size:13px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:8px 16px}
.tools .left{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 10px;font:inherit;max-width:100%}
.result-count{color:var(--muted);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .img{position:relative;aspect-ratio:1/1;background:var(--chip);border:0;padding:0;width:100%}
.card .img img{width:100%;height:100%;object-fit:contain}
.badge{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px}
.badge.out{background:var(--ink);color:var(--bg)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.brand-tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card h3{font-size:15px;line-height:1.3;font-weight:500;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--muted)}
.price-row{display:flex;gap:8px;align-items:baseline;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.price{font-family:var(--font-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.mrp{color:var(--muted);text-decoration:line-through;font-size:13px;font-variant-numeric:tabular-nums}
.rating{color:var(--good);font-size:13px;font-weight:600}
.add{margin-top:8px;height:38px;border-radius:8px;border:1px solid var(--ink);background:transparent;font-weight:600}
.add:hover:not(:disabled){background:var(--ink);color:var(--bg)}
.add:disabled{opacity:.45;cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:14px;max-width:min(920px,calc(100vw - 24px));width:100%;max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,12,24,.6)}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px;position:relative}
.detail .gallery{min-width:0}
.detail .main-img{aspect-ratio:1/1;background:var(--chip);border-radius:10px;display:grid;place-items:center}
.detail .main-img img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumbs button{width:60px;height:60px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--chip);flex:none}
.thumbs button[aria-current="true"]{border-color:var(--accent);border-width:2px}
.thumbs img{width:100%;height:100%;object-fit:contain}
.info{display:flex;flex-direction:column;gap:10px;min-width:0}
.info h2{font-size:24px;line-height:1.15}
.info .desc{color:var(--muted);white-space:pre-line}
.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.specs dt{color:var(--muted)}.specs dd{margin:0}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:99px;border:1px solid var(--line);background:var(--surface);z-index:2}
.drawer{margin:0 0 0 auto;max-width:420px;height:100vh;max-height:100vh;border-radius:0;display:flex;flex-direction:column}
.drawer[open]{display:flex}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .items{flex:1;overflow:auto;padding:8px 20px}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line img{width:56px;height:56px;object-fit:contain;background:var(--chip);border-radius:8px}
.qty{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.drawer footer{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:10px}
.drawer input{height:40px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:0 12px;font:inherit;width:100%}
.total{display:flex;justify-content:space-between;font-weight:600;font-size:17px}
.note{font-size:12px;color:var(--muted)}
footer.site{background:var(--ink);color:var(--bg);padding-block:32px;font-size:14px}
footer.site .cols{display:flex;gap:32px;flex-wrap:wrap;justify-content:space-between}
footer.site p{margin:4px 0;opacity:.8}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;font-size:14px}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}.detail{grid-template-columns:1fr;padding:16px}
  .hero-main{padding:24px}.icon-btn .label{display:none}
  .head-row{flex-wrap:wrap}.brand{order:1}.search{order:3;flex-basis:100%}.cart-btn{order:2;margin-left:auto}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>
<header class="site">
  <div class="wrap">
    <div class="head-row">
      <a class="brand" href="#" id="brand"></a>
      <div class="search"><input id="q" type="search" placeholder="Search products, brands, flavours" aria-label="Search products"></div>
      <button class="icon-btn cart-btn" id="cartBtn" aria-label="Open cart"><span class="label">Cart</span><span class="count" id="cartCount">0</span></button>
    </div>
    <nav class="cats" id="cats" aria-label="Categories"></nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="hero-main">
      <h1 id="heroTitle"></h1>
      <p id="heroSub"></p>
      <a class="btn" href="#shop">Shop now</a>
    </div>
    <div class="trust" id="trust"></div>
  </section>

  <section id="shop">
    <div class="tools">
      <div class="left">
        <select id="brand-filter" aria-label="Filter by brand"></select>
        <select id="sort" aria-label="Sort">
          <option value="featured">Featured first</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
          <option value="disc">Biggest discount</option>
          <option value="name">Name A to Z</option>
        </select>
      </div>
      <span class="result-count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer class="site">
  <div class="wrap cols">
    <div><strong id="fName"></strong><p id="fAbout"></p></div>
    <div><strong>Contact</strong><p id="fContact"></p></div>
  </div>
</footer>

<dialog id="detail"></dialog>
<dialog id="cart" class="drawer">
  <header><h2 style="font-size:20px">Your cart</h2><button class="close" style="position:static" id="cartClose" aria-label="Close cart">✕</button></header>
  <div class="items" id="cartItems"></div>
  <footer>
    <div class="total"><span>Total</span><span id="cartTotal"></span></div>
    <input id="custName" placeholder="Your name" aria-label="Your name">
    <input id="custPhone" placeholder="Phone number" inputmode="tel" aria-label="Phone number">
    <button class="btn" id="sendOrder" style="width:100%">Send order on WhatsApp</button>
    <p class="note">Your order goes to us as a WhatsApp message. We confirm stock, delivery and payment with you.</p>
  </footer>
</dialog>

<script>
/* ======================= SETTINGS: edit this block ======================= */
const CONFIG = {
  firmName: "Your Firm",            // shown in header and footer
  accentWord: "Firm",               // part of the name shown in the accent colour (optional)
  tagline: "Sports nutrition, fitness gear and apparel",
  heroTitle: "Genuine products. Straight from our shelves.",
  heroSub: "Browse our full range, check live prices and send your order in a minute.",
  topbar: "Free delivery on orders above ₹999",
  trust: [
    ["100% authentic", "Sourced directly from brands and importers"],
    ["Fast dispatch", "Orders packed within 24 hours"],
    ["Easy support", "Reach us on WhatsApp or phone"]
  ],
  currency: "₹",
  whatsappNumber: "919999999999",   // country code + number, digits only
  phone: "+91 99999 99999",
  email: "hello@yourfirm.com",
  address: "Your shop address, City",
  dataUrl: "data/site.json"   // written by your admin page, do not change
};
/* ========================================================================= */

const SAMPLE = [
 {id:"1",name:"Whey Protein Blend 1 kg",brand:"Sample Brand",category:"Protein",price:2999,mrp:3999,description:"24 g protein per scoop.\nMixes easily, no clumps.",weight_size:"1 kg",flavour:"Chocolate",rating:4.5,stock:"yes",featured:"yes"},
 {id:"2",name:"Micronized Creatine Monohydrate 250 g",brand:"Sample Brand",category:"Creatine",price:899,mrp:1199,description:"Unflavoured, 83 servings.",weight_size:"250 g",flavour:"Unflavoured",rating:4.6,stock:"yes",featured:"yes"},
 {id:"3",name:"Pre-Workout 30 Servings",brand:"Demo Labs",category:"Pre Workout",price:1799,mrp:2299,description:"Caffeine and citrulline blend.",weight_size:"30 servings",flavour:"Green Apple",rating:4.2,stock:"yes"},
 {id:"4",name:"Omega 3 Fish Oil 60 Caps",brand:"Demo Labs",category:"Vitamins",price:549,mrp:699,description:"1000 mg per capsule.",weight_size:"60 caps",rating:4.7,stock:"yes"},
 {id:"5",name:"Weight Gainer 3 kg",brand:"Sample Brand",category:"Gainers",price:2499,mrp:2499,description:"High calorie mass formula.",weight_size:"3 kg",flavour:"Vanilla",rating:4.1,stock:"no"},
 {id:"6",name:"Adjustable Dumbbell Pair 20 kg",brand:"Iron Works",category:"Fitness",price:3199,mrp:4499,description:"Quick-lock plates, rubber grip.",weight_size:"20 kg",rating:4.4,stock:"yes",featured:"yes"},
 {id:"7",name:"Yoga Mat 6 mm",brand:"Iron Works",category:"Fitness",price:699,mrp:999,description:"Non-slip, dual layer.",weight_size:"6 mm",rating:4.3,stock:"yes"},
 {id:"8",name:"Running Shoes Pro",brand:"Stride",category:"Footwear",price:3499,mrp:4999,description:"Cushioned daily trainer.",weight_size:"UK 6 to 11",rating:4.5,stock:"yes"}
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => CONFIG.currency + Number(n).toLocaleString("en-IN");
const PALETTE = ["#f2c9b8","#c9d8f0","#d3ead6","#f0e3b5","#e0d0ee","#bfe3e6"];

let products = [], cart = {}, state = {q:"", cat:"All", brand:"All", sort:"featured"};
try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch(e){ cart = {}; }
const saveCart = () => { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch(e){} };

/* ---------- data loading ---------- */
const driveToImg = u => String(u||"").trim();
const num = v => { const n = parseFloat(String(v??"").replace(/[^0-9.]/g,"")); return isNaN(n) ? 0 : n; };
function normalize(r, i){
  const imgs = [r.image_url, r.image_2, r.image_3, r.image_4, ...(r.images ? r.images.split("|") : [])].map(driveToImg).filter(Boolean);
  const price = num(r.price), mrp = num(r.mrp) || price;
  const stock = String(r.stock ?? "yes").trim().toLowerCase();
  return {
    id: String(r.id || i+1), name: r.name || "", brand: r.brand || "", category: r.category || "Other",
    subcategory: r.subcategory || "", price, mrp: Math.max(mrp, price), imgs,
    description: r.description || "", size: r.weight_size || r.size || "", flavour: r.flavour || "",
    rating: num(r.rating), inStock: !["no","0","out","out of stock","false"].includes(stock),
    featured: ["yes","true","1","y"].includes(String(r.featured||"").trim().toLowerCase())
  };
}
async function loadProducts(){
  try{
    const res = await fetch(CONFIG.dataUrl + "?v=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    Object.entries(data.settings || {}).forEach(([k,v]) => { if(v !== "" && v != null) CONFIG[k] = String(v); });
    return (data.products || []).map(normalize).filter(p => p.name && p.price > 0);
  }catch(e){
    console.warn("Could not load data/site.json, showing sample products.", e);
    return SAMPLE.map(normalize);
  }
}

/* ---------- images ---------- */
function placeholder(p){
  const c = PALETTE[(p.name.length + p.category.length) % PALETTE.length];
  const t = esc((p.brand || p.name).slice(0,14));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${c}"/><rect x="130" y="90" width="140" height="220" rx="18" fill="#161a2e" opacity=".85"/><rect x="130" y="150" width="140" height="70" fill="#e4572e"/><text x="200" y="195" text-anchor="middle" font-family="Arial" font-weight="700" font-size="20" fill="#fff">${t}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
const imgs = p => p.imgs.length ? p.imgs : [placeholder(p)];
const imgTag = (p, src, alt) => `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.onerror=null;this.src='${placeholder(p).replace(/'/g,"%27")}'">`;

/* ---------- rendering ---------- */
const disc = p => p.mrp > p.price ? Math.round((1 - p.price/p.mrp)*100) : 0;
function visible(){
  const q = state.q.trim().toLowerCase();
  let list = products.filter(p =>
    (state.cat==="All" || p.category===state.cat) &&
    (state.brand==="All" || p.brand===state.brand) &&
    (!q || [p.name,p.brand,p.category,p.flavour,p.description].join(" ").toLowerCase().includes(q)));
  const s = state.sort;
  list.sort((a,b) =>
    s==="low" ? a.price-b.price : s==="high" ? b.price-a.price :
    s==="disc" ? disc(b)-disc(a) : s==="name" ? a.name.localeCompare(b.name) :
    (b.featured-a.featured) || a.name.localeCompare(b.name));
  return list;
}
function renderCats(){
  const cats = ["All", ...new Set(products.map(p => p.category))];
  $("#cats").innerHTML = cats.map(c => `<button data-cat="${esc(c)}" aria-pressed="${c===state.cat}">${esc(c)}</button>`).join("");
  const brands = ["All", ...new Set(products.map(p => p.brand).filter(Boolean))];
  $("#brand-filter").innerHTML = brands.map(b => `<option value="${esc(b)}">${b==="All"?"All brands":esc(b)}</option>`).join("");
  $("#brand-filter").value = state.brand;
}
function renderGrid(){
  const list = visible();
  $("#count").textContent = list.length + (list.length===1 ? " product" : " products");
  $("#grid").innerHTML = list.length ? list.map(p => {
    const d = disc(p);
    return `<article class="card">
      <button class="img" data-open="${esc(p.id)}" aria-label="View ${esc(p.name)}">
        ${imgTag(p, imgs(p)[0], p.name)}
        ${!p.inStock ? '<span class="badge out">Sold out</span>' : d ? `<span class="badge">${d}% off</span>` : ""}
      </button>
      <div class="body">
        <span class="brand-tag">${esc(p.brand)}</span>
        <h3 data-open="${esc(p.id)}">${esc(p.name)}</h3>
        <span class="meta">${esc([p.size,p.flavour].filter(Boolean).join(" · "))}</span>
        ${p.rating ? `<span class="rating">★ ${p.rating.toFixed(1)}</span>` : ""}
        <div class="price-row"><span class="price">${money(p.price)}</span>${d ? `<span class="mrp">${money(p.mrp)}</span>` : ""}</div>
        <button class="add" data-add="${esc(p.id)}" ${p.inStock?"":"disabled"}>${p.inStock?"Add to cart":"Sold out"}</button>
      </div></article>`;
  }).join("") : `<div class="empty">No products match. Try a different search or category.</div>`;
}
function openDetail(id){
  const p = products.find(x => x.id===id); if(!p) return;
  const list = imgs(p), d = disc(p);
  $("#detail").innerHTML = `<div class="detail">
    <button class="close" data-close="detail" aria-label="Close">✕</button>
    <div class="gallery"><div class="main-img" id="mainImg">${imgTag(p, list[0], p.name)}</div>
      ${list.length>1 ? `<div class="thumbs">${list.map((s,i)=>`<button data-thumb="${i}" aria-current="${i===0}" aria-label="Image ${i+1}">${imgTag(p,s,"")}</button>`).join("")}</div>` : ""}</div>
    <div class="info">
      <span class="brand-tag">${esc(p.brand)} · ${esc(p.category)}</span>
      <h2>${esc(p.name)}</h2>
      ${p.rating ? `<span class="rating">★ ${p.rating.toFixed(1)}</span>` : ""}
      <div class="price-row"><span class="price" style="font-size:26px">${money(p.price)}</span>${d?`<span class="mrp">${money(p.mrp)}</span><span class="rating">${d}% off</span>`:""}</div>
      <dl class="specs">${p.size?`<dt>Size</dt><dd>${esc(p.size)}</dd>`:""}${p.flavour?`<dt>Flavour</dt><dd>${esc(p.flavour)}</dd>`:""}<dt>Availability</dt><dd>${p.inStock?"In stock":"Sold out"}</dd></dl>
      <div class="desc">${esc(p.description)}</div>
      <button class="btn" data-add="${esc(p.id)}" ${p.inStock?"":"disabled"} style="margin-top:auto;width:100%">${p.inStock?"Add to cart":"Sold out"}</button>
    </div></div>`;
  $("#detail").dataset.imgs = JSON.stringify(list);
  $("#detail").showModal();
}

/* ---------- cart ---------- */
function cartLines(){ return Object.entries(cart).map(([id,q]) => ({p: products.find(x=>x.id===id), q})).filter(l => l.p); }
function renderCart(){
  const lines = cartLines();
  const count = lines.reduce((s,l)=>s+l.q,0), total = lines.reduce((s,l)=>s+l.q*l.p.price,0);
  $("#cartCount").textContent = count;
  $("#cartTotal").textContent = money(total);
  $("#cartItems").innerHTML = lines.length ? lines.map(({p,q}) => `<div class="line">
    ${imgTag(p, imgs(p)[0], p.name)}
    <div><div style="font-weight:500;font-size:14px">${esc(p.name)}</div>
      <div class="qty"><button data-dec="${esc(p.id)}" aria-label="Decrease">−</button><span>${q}</span><button data-inc="${esc(p.id)}" aria-label="Increase">+</button></div></div>
    <strong>${money(p.price*q)}</strong></div>`).join("") : `<p class="empty" style="padding:40px 0">Your cart is empty.</p>`;
  $("#sendOrder").disabled = !lines.length;
}
function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1800);
}
function addToCart(id){
  cart[id] = (cart[id]||0) + 1; saveCart(); renderCart(); toast("Added to cart");
}
function changeQty(id, d){
  cart[id] = (cart[id]||0) + d; if(cart[id] <= 0) delete cart[id]; saveCart(); renderCart();
}
function sendOrder(){
  const lines = cartLines(); if(!lines.length) return;
  const name = $("#custName").value.trim(), phone = $("#custPhone").value.trim();
  const total = lines.reduce((s,l)=>s+l.q*l.p.price,0);
  const text = `New order from ${CONFIG.firmName} website\n\n` +
    lines.map((l,i)=>`${i+1}. ${l.p.name} x ${l.q} = ${money(l.p.price*l.q)}`).join("\n") +
    `\n\nTotal: ${money(total)}\nName: ${name||"-"}\nPhone: ${phone||"-"}`;
  window.open("https://wa.me/" + CONFIG.whatsappNumber + "?text=" + encodeURIComponent(text), "_blank", "noopener");
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-cat],[data-open],[data-add],[data-inc],[data-dec],[data-thumb],[data-close]"); if(!t) return;
  if(t.dataset.cat !== undefined){ state.cat = t.dataset.cat; renderCats(); renderGrid(); }
  else if(t.dataset.open !== undefined) openDetail(t.dataset.open);
  else if(t.dataset.add !== undefined) addToCart(t.dataset.add);
  else if(t.dataset.inc !== undefined) changeQty(t.dataset.inc, 1);
  else if(t.dataset.dec !== undefined) changeQty(t.dataset.dec, -1);
  else if(t.dataset.thumb !== undefined){
    const list = JSON.parse($("#detail").dataset.imgs), i = +t.dataset.thumb;
    const p = products.find(x => imgs(x)[0]===list[0]) || products[0];
    $("#mainImg").innerHTML = imgTag(p, list[i], "");
    document.querySelectorAll(".thumbs button").forEach((b,j)=>b.setAttribute("aria-current", j===i));
  }
  else if(t.dataset.close) $("#"+t.dataset.close).close();
});
["detail","cart"].forEach(id => $("#"+id).addEventListener("click", e => { if(e.target.id===id) e.target.close(); }));
$("#q").addEventListener("input", e => { state.q = e.target.value; renderGrid(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; renderGrid(); });
$("#brand-filter").addEventListener("change", e => { state.brand = e.target.value; renderGrid(); });
$("#cartBtn").addEventListener("click", () => { renderCart(); $("#cart").showModal(); });
$("#cartClose").addEventListener("click", () => $("#cart").close());
$("#sendOrder").addEventListener("click", sendOrder);

/* ---------- boot ---------- */
(async function(){
  products = await loadProducts();
  document.title = CONFIG.firmName + " Store";
  const n = CONFIG.firmName, w = CONFIG.accentWord;
  $("#brand").innerHTML = w && n.includes(w) ? esc(n).replace(esc(w), `<b>${esc(w)}</b>`) : esc(n);
  $("#topbar").textContent = CONFIG.topbar; if(!CONFIG.topbar) $("#topbar").hidden = true;
  $("#heroTitle").textContent = CONFIG.heroTitle; $("#heroSub").textContent = CONFIG.heroSub;
  $("#trust").innerHTML = CONFIG.trust.map(([a,b]) => `<div><strong>${esc(a)}</strong><span>${esc(b)}</span></div>`).join("");
  $("#fName").textContent = n; $("#fAbout").textContent = CONFIG.tagline;
  $("#fContact").innerHTML = [CONFIG.phone, CONFIG.email, CONFIG.address].filter(Boolean).map(esc).join("<br>");
  renderCats(); renderGrid(); renderCart();
})();
</script>
</body>
</html>
